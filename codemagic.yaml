workflows:
  unsigned-ipa:
    name: YingXingRoute unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.fyguiji.prp.ios
        DEPLOY_TARGET: "16.0"
    scripts:
      - name: Show toolchain
        script: |
          uname -m
          sw_vers
          xcodebuild -version
          ls -la
      - name: Install XcodeGen and generate project
        script: |
          set -euxo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          sed -i '' 's/15\.0/16.0/g' project.yml || true
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          rm -rf YingXingRoute.xcodeproj
          xcodegen generate --spec project.yml
          ls -la YingXingRoute.xcodeproj
          xcodebuild -list -project YingXingRoute.xcodeproj
      - name: Build (unsigned)
        script: |
          set -euxo pipefail
          xcodebuild \
            -project YingXingRoute.xcodeproj \
            -target YingXingRoute \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS= \
            build
      - name: Package IPA
        script: |
          set -euxo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "APP=$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry YingXingRoute-unsigned.ipa Payload
          unzip -l YingXingRoute-unsigned.ipa
          NAME=$(basename "$APP")
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "Payload/$NAME/Info.plist")
          file "Payload/$NAME/$EXE"
    artifacts:
      - build/ipa/*.ipa
