workflows:
  unsigned-ipa:
    name: YingXingRoute unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.fyguiji.prp.ios
        WANT_TARGET: "16.0"
    scripts:
      - name: Show toolchain
        script: |
          uname -m
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks || true
      - name: Generate project with shared scheme
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          SDKSET="$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer/SDKs/iPhoneOS.sdk/SDKSettings.plist"
          MIN=$(/usr/libexec/PlistBuddy -c "Print :MinimumDeploymentTarget" "$SDKSET" 2>/dev/null || echo "0.0")
          echo "SDK MinimumDeploymentTarget = $MIN"
          DEPLOY=$(awk -v a="$WANT_TARGET" -v b="$MIN" 'BEGIN{ if (a+0 > b+0) printf "%s", a; else printf "%s", b }')
          echo "DEPLOY_TARGET=$DEPLOY" >> "${CM_ENV:-/tmp/cm_env}"
          echo "using IPHONEOS_DEPLOYMENT_TARGET=$DEPLOY"
          cat > project.yml <<EOF
          name: YingXingRoute
          options:
            bundleIdPrefix: com.fyguiji
            deploymentTarget:
              iOS: "$DEPLOY"
            createIntermediateGroups: true
            developmentLanguage: zh-Hans
          targets:
            YingXingRoute:
              type: application
              platform: iOS
              deploymentTarget: "$DEPLOY"
              sources:
                - path: YingXingRoute
                  excludes:
                    - "Info.plist"
                    - "YingXingRoute.entitlements"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID
                  PRODUCT_NAME: YingXingRoute
                  MARKETING_VERSION: "1.21.18"
                  CURRENT_PROJECT_VERSION: "12118"
                  INFOPLIST_FILE: YingXingRoute/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "$DEPLOY"
          schemes:
            YingXingRoute:
              build:
                targets:
                  YingXingRoute: all
              run:
                config: Debug
              profile:
                config: Release
              analyze:
                config: Debug
              archive:
                config: Release
          EOF
          echo "--- project.yml ---"
          cat project.yml
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          rm -rf YingXingRoute.xcodeproj
          xcodegen generate --spec project.yml
          echo "--- schemes on disk ---"
          ls -la YingXingRoute.xcodeproj/xcshareddata/xcschemes || true
          xcodebuild -list -project YingXingRoute.xcodeproj
      - name: Build (unsigned)
        script: |
          set -euo pipefail
          DEPLOY_TARGET="${DEPLOY_TARGET:-16.0}"
          echo "DEPLOY_TARGET=$DEPLOY_TARGET"
          xcodebuild \
            -project YingXingRoute.xcodeproj \
            -scheme YingXingRoute \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        script: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "APP=$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry YingXingRoute-unsigned.ipa Payload
          unzip -l YingXingRoute-unsigned.ipa
          NAME=$(basename "$APP")
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "Payload/$NAME/Info.plist")
          file "Payload/$NAME/$EXE"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$NAME/Info.plist"
    artifacts:
      - build/ipa/*.ipa
